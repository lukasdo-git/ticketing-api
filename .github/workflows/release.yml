name: Release

# Triggers when you push a tag like v1.0.0
# Command to do that locally:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

# Needed so this workflow can create a GitHub Release and push to GHCR
permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/lukasdo-git/ticketing-api

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build JAR (tests already ran on prior CI, skipped here for speed)
        run: mvn clean package -DskipTests -B

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Create GitHub Release with JAR attached
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          generate_release_notes: true
