spring.application.name=ticketingapi

spring.datasource.url=${SPRING_JDBC_URL:jdbc:postgresql://localhost:5432/ticketing_db}
spring.datasource.username=${SPRING_DS_USERNAME:ticketing_user}
spring.datasource.password=${SPRING_DS_PASSWORD:ticketing_password}
spring.datasource.driver-class-name=org.postgresql.Driver

#can be destructive on prod, but for project purposes its fine
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8808

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true